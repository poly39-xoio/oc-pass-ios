name: OCPass
options:
  bundleIdPrefix: io.xoio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""      # 填入 Apple Team ID
    CODE_SIGN_STYLE: Automatic
targets:
  OCPass:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: OC Pass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 掃描 QR 以連接你的 OpenClaw gateway / Scan the QR code to connect to your OpenClaw gateway
        NSMicrophoneUsageDescription: 語音輸入需要麥克風權限 / Microphone access is required for voice input
        NSSpeechRecognitionUsageDescription: 將語音轉成文字送給你的 agent / Converts your speech to text for your agent
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.xoio.ocpass
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
