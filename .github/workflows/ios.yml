name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Show Xcode version
        run: xcodebuild -version && ls /Applications | grep -i xcode || true
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project OCPass.xcodeproj \
            -scheme OCPass \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  archive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate

      - name: Prepare App Store Connect key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Import signing certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PW: ${{ secrets.DIST_P12_PW }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          PROFILE_UUID: ${{ secrets.PROFILE_UUID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo -n "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile installed: $PROFILE_UUID"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project OCPass.xcodeproj \
            -scheme OCPass \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OCPass.xcarchive \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROFILE_NAME }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain-db" \
            archive

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>__TEAM_ID__</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>io.xoio.ocpass</key><string>__PROFILE_NAME__</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__TEAM_ID__/${{ secrets.TEAM_ID }}/" ExportOptions.plist
          sed -i '' "s/__PROFILE_NAME__/${{ secrets.PROFILE_NAME }}/" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/OCPass.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain-db" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Inspect IPA (diagnostics)
        run: |
          set -x
          ls -la build/export
          unzip -l build/export/OCPass.ipa | grep -i -E "AppIcon|Assets.car|Info.plist" || true
          mkdir -p /tmp/ipa && unzip -q build/export/OCPass.ipa -d /tmp/ipa
          plutil -p /tmp/ipa/Payload/OCPass.app/Info.plist | grep -i -E "icon|CFBundleIcons" || true
          ls -la /tmp/ipa/Payload/OCPass.app | head -30


      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/export/OCPass.ipa \
            -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }} \
            --verbose

      - name: Attach build to internal beta group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ github.workspace }}/../private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          APP_ID: "6825438357"
          BETA_GROUP_ID: "2ac827eb-5fc8-4466-8568-e3f7ccd3756f"
          EXPECTED_BUILD: "${{ github.run_number }}"
        run: |
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          node scripts/attach_beta_group.mjs
